<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Burger Map 🍔</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#dcecf2}header{height:62px;position:fixed;top:0;left:0;right:0;z-index:5;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #ddd}.brand{font-size:18px;font-weight:800}.actions button,.zoom button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:8px 11px;font-weight:700}.actions{display:flex;gap:7px}#viewport{position:fixed;inset:62px 0 0;overflow:hidden;touch-action:none;background:#dcecf2;cursor:grab}#viewport.dragging{cursor:grabbing}#world{position:absolute;left:50%;top:50%;transform-origin:center}#map{position:absolute;width:100%;height:100%;display:block;user-select:none}#pins{position:absolute;inset:0}.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0;font-size:30px;cursor:pointer;z-index:3}.zoom{position:fixed;right:13px;bottom:17px;z-index:6;display:flex;flex-direction:column;gap:7px}.zoom button{width:44px;height:44px;font-size:23px}.sheet{position:fixed;left:50%;bottom:13px;transform:translateX(-50%);width:min(94vw,440px);max-height:calc(100vh - 90px);overflow:auto;background:#fff;border-radius:22px;box-shadow:0 14px 50px #0004;z-index:10;padding:18px;display:none}.sheet h2{margin:0 40px 13px 0}.close{position:absolute;right:13px;top:13px;border:0;border-radius:50%;width:32px;height:32px}.label{font-size:11px;font-weight:800;color:#777;margin:10px 0 5px}input,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;font:inherit;box-sizing:border-box}textarea{height:80px}.stars button{border:0;background:none;font-size:29px;color:#ccc}.stars button.active{color:#111}.photo{width:75px;height:75px;object-fit:cover;border-radius:10px;display:none}.buttons{display:flex;gap:8px;margin-top:14px}.buttons button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800}.primary{background:#111;color:#fff}.secondary{background:#eee}.detail-photo{width:100%;height:190px;object-fit:cover;border-radius:14px;display:none}.placeholder{height:120px;border-radius:14px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:42px}.tip{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:4;background:#111;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px}</style></head><body><header><div class="brand">🍔 Burger Map</div><div class="actions"><button id="home">Dünya</button><button id="clear">Temizle</button></div></header><div id="viewport"><div id="world"><img id="map" src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg" alt="Vektörel dünya haritası"><div id="pins"></div></div></div><div class="tip" id="tip">Haritaya tıkla → hamburgerci ekle</div><div class="zoom"><button id="plus">+</button><button id="minus">−</button></div><section class="sheet" id="editor"><button class="close" id="editorClose">×</button><h2>Yeni hamburgerci</h2><div class="label">MEKAN ADI</div><input id="name" placeholder="Örn. Zula Burger"><div class="label">PUAN</div><div class="stars" id="stars"><button data-v="1">★</button><button data-v="2">★</button><button data-v="3">★</button><button data-v="4">★</button><button data-v="5">★</button></div><div class="label">GÖRSEL</div><button id="photoButton">📷 Fotoğraf seç</button><img id="preview" class="photo"><input id="photo" type="file" accept="image/*" hidden><div class="label">YORUM</div><textarea id="comment" placeholder="Yorumun..."></textarea><div class="buttons"><button class="secondary" id="cancel">Vazgeç</button><button class="primary" id="save">Kaydet</button></div></section><section class="sheet" id="detail"><button class="close" id="detailClose">×</button><img id="detailPhoto" class="detail-photo"><div id="placeholder" class="placeholder">🍔</div><h2 id="detailName"></h2><div id="detailStars" class="stars"></div><p id="detailComment"></p><small id="detailMeta"></small><div class="buttons"><button class="secondary" id="delete">Mekanı sil</button><button class="primary" id="detailClose2">Kapat</button></div></section><script>const KEY='burgerMap_final';const vp=document.getElementById('viewport'),world=document.getElementById('world'),pins=document.getElementById('pins');let W,H,s=1,x=0,y=0,downX,downY,drag=false,moved=false,sel=null,rating=5,photo='';function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function store(a){localStorage.setItem(KEY,JSON.stringify(a))}function setup(){W=Math.max(vp.clientWidth,vp.clientHeight*2.05);H=W/2;world.style.width=W+'px';world.style.height=H+'px';s=1;x=y=0;apply()}function apply(){world.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${s})`}function clamp(){let mx=Math.max(0,(W*s-vp.clientWidth)/2),my=Math.max(0,(H*s-vp.clientHeight)/2);x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y))}function zoom(n,cx=vp.clientWidth/2,cy=vp.clientHeight/2){n=Math.max(1,Math.min(16,n));let r=vp.getBoundingClientRect(),ox=(cx-r.left-r.width/2-x)/s,oy=(cy-r.top-r.height/2-y)/s;s=n;x=cx-r.left-r.width/2-ox*s;y=cy-r.top-r.height/2-oy*s;clamp();apply()}function point(cx,cy){let r=vp.getBoundingClientRect();return{x:Math.max(0,Math.min(100,(((cx-r.left-r.width/2-x)/s+W/2)/W)*100)),y:Math.max(0,Math.min(100,(((cy-r.top-r.height/2-y)/s+H/2)/H)*100))}}function render(){pins.innerHTML='';data().forEach(p=>{let b=document.createElement('button');b.className='pin';b.textContent='🍔';b.style.left=p.x+'%';b.style.top=p.y+'%';b.onclick=e=>{e.stopPropagation();detail(p.id)};b.onpointerdown=e=>e.stopPropagation();pins.appendChild(b)})}function setRating(v){rating=v;document.querySelectorAll('#stars button').forEach(b=>b.classList.toggle('active',+b.dataset.v<=v))}document.querySelectorAll('#stars button').forEach(b=>b.onclick=()=>setRating(+b.dataset.v));function editor(p){sel=p;rating=5;photo='';setRating(5);name.value='';comment.value='';preview.style.display='none';photoInput.value='';document.getElementById('editor').style.display='block';name.focus()}const name=document.getElementById('name'),comment=document.getElementById('comment'),preview=document.getElementById('preview'),photoInput=document.getElementById('photo');document.getElementById('photoButton').onclick=()=>photoInput.click();photoInput.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{photo=r.result;preview.src=photo;preview.style.display='inline-block'};r.readAsDataURL(f)};document.getElementById('save').onclick=()=>{if(!name.value.trim())return alert('Mekan adı gir.');let a=data();a.push({id:Date.now().toString(36)+Math.random(),name:name.value.trim(),rating,photo,comment:comment.value.trim(),x:sel.x,y:sel.y});try{store(a)}catch(e){return alert('Fotoğraf çok büyük. Daha küçük bir fotoğraf seç.')}closeEditor();render()};function closeEditor(){document.getElementById('editor').style.display='none'}function detail(id){let p=data().find(q=>q.id===id);if(!p)return;sel={id};detailName.textContent=p.name;detailStars.textContent='★'.repeat(p.rating)+'☆'.repeat(5-p.rating);detailComment.textContent=p.comment||'Yorum eklenmemiş.';detailMeta.textContent='Puan '+p.rating+'/5';if(p.photo){detailPhoto.src=p.photo;detailPhoto.style.display='block';placeholder.style.display='none'}else{detailPhoto.style.display='none';placeholder.style.display='flex'}document.getElementById('detail').style.display='block'}const detailName=document.getElementById('detailName'),detailStars=document.getElementById('detailStars'),detailComment=document.getElementById('detailComment'),detailMeta=document.getElementById('detailMeta'),detailPhoto=document.getElementById('detailPhoto'),placeholder=document.getElementById('placeholder');function closeDetail(){document.getElementById('detail').style.display='none';sel=null}document.getElementById('delete').onclick=()=>{if(sel&&confirm('Bu mekanı silmek istiyor musun?')){store(data().filter(p=>p.id!==sel.id));closeDetail();render()}};editorClose.onclick=closeEditor;cancel.onclick=closeEditor;detailClose.onclick=closeDetail;detailClose2.onclick=closeDetail;plus.onclick=()=>zoom(s*1.35);minus.onclick=()=>zoom(s/1.35);home.onclick=()=>{s=1;x=y=0;apply()};clear.onclick=()=>{if(confirm('Tüm mekanlar silinsin mi?')){localStorage.removeItem(KEY);render()}};vp.onwheel=e=>{e.preventDefault();zoom(s*(e.deltaY<0?1.22:.82),e.clientX,e.clientY)};vp.onpointerdown=e=>{if(e.pointerType==='touch')return;downX=e.clientX;downY=e.clientY;drag=true;moved=false;vp.classList.add('dragging');vp.setPointerCapture(e.pointerId)};vp.onpointermove=e=>{if(e.pointerType==='touch'||!drag)return;let dx=e.clientX-downX,dy=e.clientY-downY;if(Math.hypot(dx,dy)>4)moved=true;x+=dx;y+=dy;clamp();apply();downX=e.clientX;downY=e.clientY};vp.onpointerup=e=>{if(e.pointerType==='touch')return;vp.classList.remove('dragging');if(!moved)editor(point(e.clientX,e.clientY));drag=false};let touches=[];vp.ontouchstart=e=>{touches=[...e.touches];if(touches.length===1){downX=touches[0].clientX;downY=touches[0].clientY;moved=false}else if(touches.length===2){pinchDist=Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);pinchScale=s}};let pinchDist=0,pinchScale=1;vp.ontouchmove=e=>{e.preventDefault();let t=[...e.touches];if(t.length===2&&touches.length>=2){let d=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY),mx=(t[0].clientX+t[1].clientX)/2,my=(t[0].clientY+t[1].clientY)/2;zoom(pinchScale*d/pinchDist,mx,my)}else if(t.length===1&&touches.length===1){let dx=t[0].clientX-touches[0].clientX,dy=t[0].clientY-touches[0].clientY;if(Math.hypot(t[0].clientX-downX,t[0].clientY-downY)>7)moved=true;x+=dx;y+=dy;clamp();apply()}touches=t};vp.ontouchend=e=>{if(e.touches.length===0&&touches.length===1&&!moved)editor(point(touches[0].clientX,touches[0].clientY));touches=[...e.touches]};setup();render();</script></body></html>
